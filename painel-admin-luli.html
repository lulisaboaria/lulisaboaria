<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel Administrativo | Luli Saboaria</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--rosa:#e98a9b;--rosa2:#a93f60;--vinho:#6f2942;--creme:#fff8f3;--texto:#513c45;--verde:#207a54;--sombra:0 12px 30px rgba(111,41,66,.12)}*{box-sizing:border-box}body{margin:0;font-family:Poppins,sans-serif;background:var(--creme);color:var(--texto)}h1,h2,h3{font-family:'Playfair Display',serif;color:var(--vinho)}.container{width:min(1180px,92%);margin:auto}header{background:var(--vinho);color:#fff;padding:25px 0}.head{display:flex;justify-content:space-between;align-items:center;gap:18px}.head h1{color:#fff;margin:0}.head a{color:#fff;text-decoration:none;border:1px solid #ffffff66;border-radius:30px;padding:10px 16px}main{padding:42px 0}.notice{display:none;padding:14px 16px;border-radius:12px;margin-bottom:20px}.notice.show{display:block}.success{background:#e9f8f0;color:#17613f}.error{background:#ffe8eb;color:#8e2947}.warning{background:#fff1cf;color:#745400}.layout{display:grid;grid-template-columns:390px 1fr;gap:25px;align-items:start}.panel{background:#fff;border-radius:22px;padding:24px;box-shadow:var(--sombra)}.panel h2{margin-top:0}.form{display:grid;gap:14px}.field{display:grid;gap:6px}.field label{font-weight:600}.field input,.field textarea{width:100%;padding:12px;border:1px solid #dec8cf;border-radius:11px;font:inherit}.field textarea{min-height:90px;resize:vertical}.check{display:flex;gap:9px;align-items:center}.check input{width:18px;height:18px}.preview{height:190px;display:grid;place-items:center;background:#fff;border:1px dashed #dec8cf;border-radius:15px;overflow:hidden}.preview img{width:100%;height:100%;object-fit:contain}.placeholder{color:#967d86;text-align:center;padding:15px}.buttons{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:12px 16px;font:600 1rem Poppins,sans-serif;cursor:pointer;background:var(--rosa2);color:#fff}.btn.secondary{background:#eee3e7;color:var(--vinho)}.btn.danger{background:#a52f43}.btn:disabled{opacity:.55;cursor:not-allowed}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:15px}.toolbar input{padding:11px;border:1px solid #dec8cf;border-radius:11px;max-width:280px;width:100%}.list{display:grid;gap:13px}.item{display:grid;grid-template-columns:86px 1fr auto;gap:15px;align-items:center;border:1px solid #f0e1e6;border-radius:16px;padding:12px}.item img,.noimg{width:86px;height:86px;border-radius:12px;object-fit:contain;background:#fff8f3}.noimg{display:grid;place-items:center;color:#d49aaa}.meta h3{margin:0 0 4px}.meta p{margin:2px 0;font-size:.9rem}.tag{display:inline-block;padding:3px 8px;border-radius:15px;font-size:.76rem;background:#e9f8f0;color:#17613f}.tag.off{background:#eee;color:#666}.item-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.small{padding:8px 10px;font-size:.85rem}.empty{text-align:center;padding:35px;color:#876f78}.help{font-size:.82rem;color:#806a73}.loader{text-align:center;padding:25px}@media(max-width:850px){.layout{grid-template-columns:1fr}.item{grid-template-columns:70px 1fr}.item img,.noimg{width:70px;height:70px}.item-actions{grid-column:1/-1;justify-content:flex-start}.head{align-items:flex-start;flex-direction:column}}
</style></head><body>
<header><div class="container head"><div><h1>Painel Administrativo</h1><div>Cadastro de produtos da Luli Saboaria</div></div><a href="index.html"><i class="fa-solid fa-arrow-left"></i> Voltar ao site</a></div></header>
<main><div class="container"><div id="notice" class="notice" role="status"></div><div class="layout">
<section class="panel"><h2 id="formTitle">Cadastrar produto</h2><form id="productForm" class="form">
<input id="productId" type="hidden"><div class="field"><label for="produto">Nome do produto</label><input id="produto" required maxlength="100" placeholder="Ex.: Sabonete infantil"></div>
<div class="field"><label for="descricao">Descrição</label><textarea id="descricao" maxlength="300" placeholder="Aroma, composição e características"></textarea></div>
<div class="field"><label for="preco">Preço</label><input id="preco" type="number" min="0" step="0.01" required placeholder="19,90"></div>
<div class="field"><label for="estoque">Quantidade em estoque</label><input id="estoque" type="number" min="0" step="1" required value="0"></div>
<div class="field"><label for="imagem">Imagem do produto</label><input id="imagem" placeholder="imagens/sabonete.png ou URL completa"><span class="help">No mesmo GitHub, use: imagens/nome-do-arquivo.png</span></div>
<div class="preview" id="preview"><div class="placeholder"><i class="fa-regular fa-image fa-2x"></i><br>Prévia da imagem</div></div>
<label class="check"><input id="ativo" type="checkbox" checked> Produto ativo e visível na loja</label>
<div class="buttons"><button class="btn" id="saveBtn" type="submit"><i class="fa-solid fa-floppy-disk"></i> Salvar produto</button><button class="btn secondary" id="cancelBtn" type="button" hidden>Cancelar edição</button></div>
</form></section>
<section class="panel"><div class="toolbar"><div><h2 style="margin:0">Produtos cadastrados</h2><span id="count">0 produtos</span></div><input id="search" type="search" placeholder="Buscar produto"></div><div id="list" class="list"><div class="loader">Carregando...</div></div></section>
</div></div></main>
<script>
const SUPABASE_URL='https://hwsqntesvlqwpsjfeica.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_V16Zh3W6yjflEXOpypWzPw_-djx67tE';
const client=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=s=>document.querySelector(s),form=$('#productForm'),listEl=$('#list'),notice=$('#notice');let products=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function showNotice(text,type='success'){notice.textContent=text;notice.className='notice show '+type;scrollTo({top:0,behavior:'smooth'});setTimeout(()=>notice.classList.remove('show'),5000)}
function imageUrl(v){const src=String(v||'').trim();return src}
function updatePreview(){const src=imageUrl($('#imagem').value);$('#preview').innerHTML=src?`<img src="${esc(src)}" alt="Prévia" onerror="this.parentElement.innerHTML='<div class=&quot;placeholder&quot;>Imagem não encontrada. Confira o caminho.</div>'">`:'<div class="placeholder"><i class="fa-regular fa-image fa-2x"></i><br>Prévia da imagem</div>'}
function resetForm(){form.reset();$('#productId').value='';$('#ativo').checked=true;$('#estoque').value=0;$('#formTitle').textContent='Cadastrar produto';$('#saveBtn').innerHTML='<i class="fa-solid fa-floppy-disk"></i> Salvar produto';$('#cancelBtn').hidden=true;updatePreview()}
function render(){const q=$('#search').value.toLowerCase().trim(),shown=products.filter(p=>(p.produto+' '+(p.descricao||'')).toLowerCase().includes(q));$('#count').textContent=products.length+' '+(products.length===1?'produto':'produtos');if(!shown.length){listEl.innerHTML='<div class="empty">Nenhum produto encontrado.</div>';return}listEl.innerHTML=shown.map(p=>`<article class="item">${p.imagem_url?`<img src="${esc(imageUrl(p.imagem_url))}" alt="${esc(p.produto)}" onerror="this.outerHTML='<div class=&quot;noimg&quot;><i class=&quot;fa-solid fa-spa&quot;></i></div>'">`:'<div class="noimg"><i class="fa-solid fa-spa"></i></div>'}<div class="meta"><h3>${esc(p.produto)}</h3><p>${esc(p.descricao||'Sem descrição')}</p><p><strong>${new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(+p.preco||0)}</strong> · Estoque: ${+p.quantidade_estoque||0}</p><span class="tag ${p.ativo?'':'off'}">${p.ativo?'Ativo':'Inativo'}</span></div><div class="item-actions"><button class="btn secondary small" onclick="editProduct(${p.id})"><i class="fa-solid fa-pen"></i> Editar</button><button class="btn danger small" onclick="removeProduct(${p.id})"><i class="fa-solid fa-trash"></i> Excluir</button></div></article>`).join('')}
async function load(){listEl.innerHTML='<div class="loader">Carregando...</div>';const{data,error}=await client.from('produtos').select('*').order('id',{ascending:false});if(error){listEl.innerHTML='<div class="empty">Falha ao carregar produtos.</div>';showNotice(error.message,'error');return}products=data||[];render()}
form.addEventListener('submit',async e=>{e.preventDefault();const id=$('#productId').value,payload={produto:$('#produto').value.trim(),descricao:$('#descricao').value.trim(),preco:Number($('#preco').value),quantidade_estoque:Number($('#estoque').value),imagem_url:$('#imagem').value.trim(),ativo:$('#ativo').checked};$('#saveBtn').disabled=true;let result=id?await client.from('produtos').update(payload).eq('id',id):await client.from('produtos').insert(payload);$('#saveBtn').disabled=false;if(result.error){showNotice(result.error.message,'error');return}showNotice(id?'Produto atualizado.':'Produto cadastrado.');resetForm();await load()});
window.editProduct=id=>{const p=products.find(x=>x.id===id);if(!p)return;$('#productId').value=p.id;$('#produto').value=p.produto||'';$('#descricao').value=p.descricao||'';$('#preco').value=p.preco??0;$('#estoque').value=p.quantidade_estoque??0;$('#imagem').value=p.imagem_url||'';$('#ativo').checked=!!p.ativo;$('#formTitle').textContent='Editar produto';$('#saveBtn').innerHTML='<i class="fa-solid fa-floppy-disk"></i> Atualizar produto';$('#cancelBtn').hidden=false;updatePreview();scrollTo({top:0,behavior:'smooth'})};
window.removeProduct=async id=>{const p=products.find(x=>x.id===id);if(!confirm(`Excluir o produto "${p?.produto||''}"?`))return;const{error}=await client.from('produtos').delete().eq('id',id);if(error){showNotice(error.message,'error');return}showNotice('Produto excluído.');await load()};
$('#imagem').addEventListener('input',updatePreview);$('#search').addEventListener('input',render);$('#cancelBtn').onclick=resetForm;resetForm();load();
</script></body></html>
