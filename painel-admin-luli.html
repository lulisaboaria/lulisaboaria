<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel Luli</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--v:#6f2942;--r:#a93f60;--c:#fff8f3}*{box-sizing:border-box}body{margin:0;background:var(--c);font-family:Arial,sans-serif;color:#513c45}.wrap{width:min(1050px,92%);margin:auto}header{background:var(--v);color:#fff;padding:22px 0}h1,h2{font-family:Georgia,serif}main{padding:35px 0}.layout{display:grid;grid-template-columns:370px 1fr;gap:22px}.box{background:#fff;padding:22px;border-radius:20px;box-shadow:0 10px 28px #6f29421c}.form{display:grid;gap:12px}label{font-weight:bold;display:grid;gap:5px}input,textarea,button{font:inherit;padding:11px;border-radius:10px}input,textarea{border:1px solid #dec8cf}textarea{min-height:85px}.check{display:flex;gap:8px}.check input{width:auto}.btn{border:0;background:var(--r);color:white;font-weight:bold;cursor:pointer}.secondary{background:#eee3e7;color:var(--v)}.preview{height:170px;border:1px dashed #dec8cf;border-radius:14px;display:grid;place-items:center;overflow:hidden}.preview img{width:100%;height:100%;object-fit:contain}.notice{display:none;padding:12px;margin-bottom:15px;border-radius:10px}.notice.on{display:block}.ok{background:#e7f8ee}.err{background:#ffe5ea}.items{display:grid;gap:10px}.item{border:1px solid #eee0e5;padding:10px;border-radius:14px;display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center}.item img{width:70px;height:70px;border-radius:50%;object-fit:cover}.actions{display:flex;gap:6px}.actions button{border:0;cursor:pointer}.danger{background:#b43b51;color:#fff}@media(max-width:800px){.layout{grid-template-columns:1fr}.item{grid-template-columns:60px 1fr}.actions{grid-column:1/-1}}</style></head><body><header><div class="wrap"><h1>Painel Administrativo Luli</h1></div></header><main><div class="wrap"><div id="notice" class="notice"></div><div class="layout"><section class="box"><h2 id="title">Cadastrar produto</h2><form id="form" class="form"><input id="id" type="hidden"><label>Nome<input id="produto" required></label><label>Descrição<textarea id="descricao"></textarea></label><label>Preço<input id="preco" type="number" min="0" step=".01" required></label><label>Estoque<input id="estoque" type="number" min="0" step="1" value="0" required></label><label>Imagem do produto<input id="arquivo" type="file" accept="image/png,image/jpeg,image/webp,image/gif"></label><div id="preview" class="preview">Selecione uma imagem</div><label class="check"><input id="ativo" type="checkbox" checked> Produto ativo</label><button class="btn" id="save" type="submit">Salvar produto</button><button class="btn secondary" id="cancel" type="button" hidden>Cancelar edição</button></form></section><section class="box"><h2>Produtos cadastrados</h2><div id="items" class="items">Carregando...</div></section></div></div></main><script>
const URL='https://hwsqntesvlqwpsjfeica.supabase.co',KEY='sb_publishable_V16Zh3W6yjflEXOpypWzPw_-djx67tE',BUCKET='produtos',db=supabase.createClient(URL,KEY);let produtos=[],imagemAtual='';const $=s=>document.querySelector(s);function avisar(t,e=false){$('#notice').textContent=t;$('#notice').className='notice on '+(e?'err':'ok')}function previa(u){$('#preview').innerHTML=u?`<img src="${u}" alt="Prévia">`:'Selecione uma imagem'}async function upload(file){const ext=(file.name.split('.').pop()||'jpg').toLowerCase(),path=`produto-${Date.now()}-${crypto.randomUUID()}.${ext}`;const{error}=await db.storage.from(BUCKET).upload(path,file,{contentType:file.type,upsert:false});if(error)throw error;return db.storage.from(BUCKET).getPublicUrl(path).data.publicUrl}async function load(){const{data,error}=await db.from('produtos').select('*').order('id',{ascending:false});if(error){avisar(error.message,true);return}produtos=data||[];$('#items').innerHTML=produtos.length?produtos.map(p=>`<article class="item"><img src="${p.imagem_supabase_url||p.imagem_url||''}" onerror="this.style.visibility='hidden'"><div><b>${p.produto}</b><br><small>R$ ${Number(p.preco).toFixed(2).replace('.',',')} · estoque ${p.quantidade_estoque} · ${p.ativo?'ativo':'inativo'}</small></div><div class="actions"><button onclick="editar(${p.id})">Editar</button><button class="danger" onclick="excluir(${p.id})">Excluir</button></div></article>`).join(''):'Nenhum produto cadastrado.'}function reset(){document.querySelector('#form').reset();$('#id').value='';$('#ativo').checked=true;$('#estoque').value=0;imagemAtual='';previa('');$('#title').textContent='Cadastrar produto';$('#cancel').hidden=true}$('#arquivo').onchange=e=>{const f=e.target.files[0];if(f)previa(URL.createObjectURL(f))};$('#form').onsubmit=async e=>{e.preventDefault();try{$('#save').disabled=true;let imagem=imagemAtual;const f=$('#arquivo').files[0];if(f)imagem=await upload(f);const dados={produto:$('#produto').value.trim(),descricao:$('#descricao').value.trim(),preco:+$('#preco').value,quantidade_estoque:+$('#estoque').value,ativo:$('#ativo').checked,imagem_supabase_url:imagem};const id=$('#id').value,{error}=id?await db.from('produtos').update(dados).eq('id',id):await db.from('produtos').insert(dados);if(error)throw error;avisar(id?'Produto atualizado.':'Produto cadastrado.');reset();await load()}catch(x){avisar(x.message,true)}finally{$('#save').disabled=false}};window.editar=id=>{const p=produtos.find(x=>x.id===id);$('#id').value=p.id;$('#produto').value=p.produto;$('#descricao').value=p.descricao||'';$('#preco').value=p.preco;$('#estoque').value=p.quantidade_estoque;$('#ativo').checked=p.ativo;imagemAtual=p.imagem_supabase_url||p.imagem_url||'';previa(imagemAtual);$('#title').textContent='Editar produto';$('#cancel').hidden=false;scrollTo({top:0,behavior:'smooth'})};window.excluir=async id=>{if(!confirm('Excluir este produto?'))return;const{error}=await db.from('produtos').delete().eq('id',id);if(error)avisar(error.message,true);else{avisar('Produto excluído.');load()}};$('#cancel').onclick=reset;load();
</script></body></html>
